name: Reusable Claude Review

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Required JSON for the job's runs-on: a quoted label such as '"ubuntu-latest"', an
          array of labels such as '["self-hosted","linux"]', or a group/labels object.
        type: string
        required: true
      code-model:
        description: Claude model for the code review.
        type: string
        default: claude-opus-5-5
      docs-model:
        description: Claude model for the documentation review.
        type: string
        default: claude-sonnet-5-5
      code-effort:
        description: Claude Code effort level for the code review.
        type: string
        default: high
      docs-effort:
        description: Claude Code effort level for the documentation review.
        type: string
        default: xhigh
      subagent-model:
        description: Claude model for the confirming agents in both reviews.
        type: string
        default: claude-sonnet-5-5
      doc-domains:
        description: >-
          JSON array of documentation hostnames added to the shared WebFetch allowlist, such as
          '["docs.python.org"]'.
        type: string
        default: '[]'
      doc-suffixes:
        description: JSON array of lowercase file suffixes reviewed by the docs job.
        type: string
        default: '[".md",".markdown",".mdx"]'
      source-suffixes:
        description: JSON array of file suffixes whose added lines are compared for copies.tsv.
        type: string
        default: '[".rs",".py",".sh",".js",".mjs",".cjs",".ts",".mts",".cts"]'
      copy-ignore-prefixes:
        description: JSON array of line prefixes, such as comments and imports, that copies.tsv ignores.
        type: string
        default: '["//","/*","#","*","use ","pub use ","import ","from ","} from ","export * ","export {"]'
      exclude-paths:
        description: >-
          JSON array of repository-relative glob patterns using *, ? and ** that exclude paths
          from review. A value replaces the default lockfile patterns.
        type: string
        default: '["**/*.lock","**/package-lock.json","**/pnpm-lock.yaml"]'
      review-policy-path:
        description: Repository-relative path of the review policy read from the base branch.
        type: string
        default: REVIEW.md
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 60
    secrets:
      claude_code_oauth_token:
        description: Claude Code OAuth token owned by the calling repository.
        required: true

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review (${{ matrix.name }})
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.sender.type == 'User' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: code
            name: コード
          - kind: docs
            name: 文書
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Run the review for this kind
        uses: $/.github/actions/claude-review
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
        with:
          kind: ${{ matrix.kind }}
          code_model: ${{ inputs.code-model }}
          docs_model: ${{ inputs.docs-model }}
          code_effort: ${{ inputs.code-effort }}
          docs_effort: ${{ inputs.docs-effort }}
          subagent_model: ${{ inputs.subagent-model }}
          doc_domains: ${{ inputs.doc-domains }}
          doc_suffixes: ${{ inputs.doc-suffixes }}
          source_suffixes: ${{ inputs.source-suffixes }}
          copy_ignore_prefixes: ${{ inputs.copy-ignore-prefixes }}
          exclude_paths: ${{ inputs.exclude-paths }}
          review_policy_path: ${{ inputs.review-policy-path }}
          timeout_minutes: ${{ inputs.timeout-minutes }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
