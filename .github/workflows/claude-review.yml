name: Reusable Claude Review

on:
  workflow_call:
    secrets:
      claude_code_oauth_token:
        description: Claude Code OAuth token owned by the calling repository.
        required: true

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review (${{ matrix.name }})
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.sender.type == 'User' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: code
            name: コード
          - kind: docs
            name: 文書
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run the review for this kind
        uses: $/.github/actions/claude-review
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
        with:
          kind: ${{ matrix.kind }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
