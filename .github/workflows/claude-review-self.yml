name: Claude review (self)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: $/.github/workflows/claude-review.yml
    # A public repository must not run pull request code on self-hosted runners.
    with:
      runs-on: '"ubuntu-latest"'
      doc-domains: '["docs.python.org"]'
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
